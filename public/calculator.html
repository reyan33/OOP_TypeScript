<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Calculator</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background-color: #ffedd5;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 4rem 1rem;
        font-family: Arial, sans-serif;
      }

      .calculator {
        width: 100%;
        max-width: 400px;
        background-color: white;
        padding: 2rem;
        border-radius: 1rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      }

      h1 {
        margin-top: 0;
        text-align: center;
        color: #e86a33;
      }

      input,
      select,
      button {
        width: 100%;
        padding: 0.8rem;
        margin-bottom: 1rem;
        border-radius: 8px;
        font-size: 1rem;
      }

      input,
      select {
        border: 1px solid #e86a33;
        background-color: white;
      }

      select {
        text-align: center;
      }

      input:focus,
      select:focus {
        outline: none;
        border: 2px solid #e86a33;
      }

      button {
        border: none;
        background-color: #e86a33;
        color: white;
        cursor: pointer;
      }

      button:hover {
        background-color: #d85d2b;
      }

      #result {
        text-align: center;
        color: #e86a33;
        font-weight: bold;
        font-size: 1.2rem;
      }
    </style>
  </head>

  <body>
    <div class="calculator">
      <h1>Calculator</h1>

      <input id="number1" type="number" placeholder="First number" />

      <select id="operation">
        <option value="">Select an operation</option>
        <option value="+">+</option>
        <option value="-">−</option>
        <option value="*">×</option>
        <option value="/">÷</option>
      </select>

      <input id="number2" type="number" placeholder="Second number" />

      <button id="calculate">Calculate</button>

      <p id="result">Result: 0</p>
    </div>

    <script type="module" src="./build/calculator.js"></script>
  </body>
</html>
